<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Students - Edugram Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-md navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">Edugram Admin</a>
  </div>
</nav>
<main class="container py-4">
  <h3>Students</h3>
  <div class="row mb-3">
    <div class="col-12 col-md-6">
      <label class="visually-hidden" for="search">Search name or email</label>
      <input id="search" class="form-control" placeholder="Search name or email">
    </div>
    <div class="col-12 col-md-6 text-end">
      <div id="pagination" class="btn-group" role="group"></div>
    </div>
  </div>
  <p id="directory-status" role="status" aria-live="polite"></p>
  <div class="table-responsive">
    <table class="table table-striped" id="students-table">
      <thead><tr><th>#</th><th>Name</th><th>Email</th><th>Class</th><th>Roll</th><th>Tests Attended</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</main>
<script src="ui.js"></script>
<script>EduUI.initDirectory("students", ["student_name", "email", "class", "roll_no", "tests_attended"]);</script>
</body>
</html>
